<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOIKOT HOSTING</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: var(--tg-theme-button-color, #2481cc); }
        p { line-height: 1.6; }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 SOIKOT HOSTING</h1>
        <p>স্বাগতম! এটি আপনার টেলিগ্রাম ওয়েব অ্যাপ।</p>
        <p>এখান থেকে আপনি হোস্টিং সার্ভিস, স্ট্যাটাস বা অন্য যেকোনো ফিচার অ্যাড করতে পারবেন।</p>
        
        <button class="btn" onclick="sendDataToBot()">✅ ডেটা বট-এ পাঠান</button>
        <button class="btn" style="background-color: var(--tg-theme-destructive-text-color, #ff3b30); margin-top: 10px;" onclick="closeApp()">❌ বন্ধ করুন</button>
    </div>

    <script>
        // Telegram Web App ইনিশিয়ালাইজ
        const tg = window.Telegram.WebApp;
        tg.expand(); // পুরো স্ক্রিন জুড়ে দেখানো

        // বট-এ ডেটা পাঠানোর ফাংশন
        function sendDataToBot() {
            const data = JSON.stringify({ action: "webapp_clicked", user: tg.initDataUnsafe?.user?.first_name });
            tg.sendData(data); // এই ডেটা বটের 'message' হ্যান্ডলারে যাবে
        }

        // অ্যাপ বন্ধ করার ফাংশন
        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
